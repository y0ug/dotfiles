#
# mmc - My default prompt theme
#

add_newline = false

# A minimal left prompt
format = """$shell$python$directory$character"""

# Move the rest of the prompt to the right
right_format = """$status$cmd_duration$git_branch${custom.git_status_dirty}$git_status"""

# Timeout for commands executed by starship (in milliseconds)
command_timeout = 2000

# Set the palette.
palette = "tokyo_night"


# Define custom colors
[palettes.tokyo_night]
black = '#15161e'
blue = '#7aa2f7'
cyan = '#7dcfff'
green = '#9ece6a'
purple = '#bb9af7'
red = '#f7768e'
white = '#a9b1d6'
yellow = '#e0af68'

[palettes.tokyo_night_256]
black = '16'
blue = '111'
cyan = '117'
green = '149'
purple = '141'
red = '210'
white = '146'
yellow = '179'

[palettes.wombat]
black = '#000000'
blue = '#5da9f6'
cyan = '#82fff7'
green = '#b1e969'
purple = '#e86aff'
red = '#ff615a'
white = '#dedacf'
yellow = '#ebd99c'

[palettes.wombat_256]
black = '0'
blue = '75'
cyan = '123'
green = '149'
purple = '171'
red = '203'
white = '188'
yellow = '223'

[character]
format = "$symbol "
# success_symbol = "[❯](purple)[❯](cyan)"
# error_symbol = "[❯](yellow)[❯](red)"
# vicmd_symbol = "[❮](purple)[❮](cyan)"
success_symbol = "[❯](cyan)"
error_symbol = "[❯](red)"
vicmd_symbol = "[❮](purple)"

[python]
format = '[(\($virtualenv\) )]($style)'
style = 'white'

[directory]
style = "blue"
truncation_length = 3
truncation_symbol = ""
fish_style_pwd_dir_length = 3

# Right prompt uses left space padding.
[git_branch]
format = ' [$branch]($style)'
style = 'green'

[git_status]
format = '( [\[$ahead_behind$stashed\]]($style))'
disabled = false
style = "cyan"
stashed = "≡"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"

[custom.git_status_dirty]
disabled = true
when = 'test -n "$(git status --porcelain 2>/dev/null)"'
symbol = "•"
style = "purple"
format = "[$symbol]($style)"
shell = ["sh"]

[shell]
format = '[$indicator]($style)'
fish_indicator = '🐟'            # 󰈺 🐟 🐠
powershell_indicator = '_'
pwsh_indicator = '>_'
zsh_indicator = '󠀥%'
bash_indicator = '󠀥$'
style = 'cyan bold'
disabled = false

[cmd_duration]
format = ' [$duration]($style)'

[line_break]
disabled = true

[status]
disabled = false
pipestatus = true
format = '[$symbol$int]($style)'
symbol = '✘'
pipestatus_format = '\[$pipestatus\]($style)'

[custom.shell_prompt_start]
command = '''printf 'AAAA\033]133;A\033\\''''
format = '$output'
when = true
unsafe_no_escape = true
