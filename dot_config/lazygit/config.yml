customCommands:
  - key: "C"
    command: "git cmc -y"
    context: "files"
    description: "AI-generated commit"
  - key: <c-c>
    description: Pick AI commit
    command: "git cmc"
    context: files
    output: terminal
  - key: "e"
    command: 'echo git show "{{.SelectedCommit.Hash}}:{{.SelectedPath}}" | wl-copy'
    context: "commitFiles"
  - key: "<c-a>"
    description: "amend the author of last commit"
    command: 'git commit --amend --author="Caddy Glow <caddyglow@pm.me"'
    # command: 'git commit --amend --author="Hugo Caron <hca433@gmail.com>"'
    context: "commits"
  - key: "<Delete>"
    command: "trash-put {{.SelectedFile.Name | quote}}"
    context: "files"
    description: "Move file to trash"

  # If you want to delete all untracked files/directories
