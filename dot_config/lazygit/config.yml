customCommands:
  - key: "C"
    command: '/home/rick/.claude/local/claude "Generate a git commit message on the first line and detailed body based on the staged changes. Describe the changes made in a way that helps someone reviewing change to understand what changed and why. Output only the commit message with no extra text." | git commit -F -'
    context: "files"
    description: "AI-generated commit with Claude Code"
  - key: <c-n>
    description: Pick AI commit
    command: git diff --cached | aichat -r commit - | git commit -F - -e
    context: files
    output: terminal
  - key: <c-c>
    output: terminal
    description: Pick AI commit (no verify)
    command: git diff --cached | aichat -r commit - | git commit -F -
    context: files
  - key: "e"
    command: 'echo git show "{{.SelectedCommit.Hash}}:{{.SelectedPath}}" | wl-copy'
    context: "commitFiles"
  - key: "<c-a>"
    description: "amend the author of last commit"
    command: 'git commit --amend --author="Hugo Caron <hca433@gmail.com>"'
    context: "commits"
  - key: "<Delete>"
    command: "trash-put {{.SelectedFile.Name | quote}}"
    context: "files"
    description: "Move file to trash"

