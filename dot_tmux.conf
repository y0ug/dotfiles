# Pane Borders
set -g pane-border-style fg=#4B5263
set -g pane-active-border-style fg=#CA9EE6
set -g pane-border-lines double
set -g pane-border-indicators arrows
set -g pane-border-status top


# Activity Notifications
# it's overriden by the custom window-status-format below
# setw -g window-status-bell-style     "bg=#EBCB8B,fg=#292c3c,bold"
setw -g window-status-activity-style "bg=#A6E3A1,fg=#292c3c,bold"

# Copy mode
set -g mode-style bg=#CA9EE6,fg=#292c3c,bold

vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"
bind-key -n 'M-h' if-shell "$is_vim" 'send-keys M-h'  'select-pane -L'
bind-key -n 'M-j' if-shell "$is_vim" 'send-keys M-j'  'select-pane -D'
bind-key -n 'M-k' if-shell "$is_vim" 'send-keys M-k'  'select-pane -U'
bind-key -n 'M-l' if-shell "$is_vim" 'send-keys M-l'  'select-pane -R'

tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -T copy-mode-vi 'M-h' select-pane -L
bind-key -T copy-mode-vi 'M-j' select-pane -D
bind-key -T copy-mode-vi 'M-k' select-pane -U
bind-key -T copy-mode-vi 'M-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l


## Custom Keybindings
bind Tab last-window
bind r source-file ~/.tmux.conf
bind s run-shell "tmux-switch-pane"
bind A next-window -a

# Ctrl-k without leader prefix to clear histoyr scrollback
bind -n C-k clear-history

bind J "join-pane -s !" # Extract pan use is prefix !
bind v copy-mode
bind G neww -n "git" -S lazygit

# set default directory for new windows in this session to current directory:
bind M-c attach-session -c "#{pane_current_path}"
bind C new-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

bind-key -T copy-mode-vi v send-keys -X begin-selection

set -g display-panes-time 1200
