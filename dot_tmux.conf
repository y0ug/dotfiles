# Enable visual indicators for bell events
set -g bell-action any
set -g visual-bell off

# Tell tmux to mark windows when a bell happens
set -g monitor-bell on

set-hook -g alert-bell 'run-shell "notify-send \"🔔 Tmux Bell\" \"Session: #{session_name}\nWindow: #{window_index}:#{window_name}\nPane: #{pane_index}\" --urgency=normal"'

set -g status on
set -g status-interval 1
set -g status-justify left
set -g status-left-length 40
set -g status-right-length 40

# Status Bar
# Catppuccin Frappe colors
set -g status-style bg=#292c3c,fg=white
# set -g status-style bg=black,fg=white

setw -g window-status-style bg=#4B5263,fg=white
setw -g window-status-current-style bg=#C678DD,fg=black

set -g status-left "#[bg=#A6E3A1,fg=black] #S #[default] "

