unbind C-b
# Switch to Ctrl+z as prefix key less likely to conflict with other apps
# set -g prefix C-z
# bind C-z send-prefix

unbind C-z
set -g prefix C-Space
bind C-Space send-prefix

set -s set-clipboard on
# set -s copy-command 'wl-copy'

## Sensible Defaults
set -s escape-time 0
set -g history-limit 50000
set -g display-time 4000
set -g display-panes-time 8000
set -g status-interval 5
# (OS X) Fix pbcopy/pbpaste for old tmux versions (pre 2.6)
# set -g default-command "reattach-to-user-namespace -l $SHELL"
set -g default-terminal "screen-256color"
# Emacs key bindings in tmux command prompt (prefix + :) are better than
# vi keys, even for vim users
set -g status-keys emacs
set -g focus-events on
setw -g aggressive-resize on
## Sensible end


## Mine settings 
set -g mode-keys vi
set -g allow-passthrough on
set -g base-index 1
set -g pane-base-index 1
set -g mouse on
set -g renumber-windows on

## Deal with terminal capabilities
# use screen-256color seems to allow home/end keys 
#set -g default-terminal "xterm-256color"
set -g default-terminal "screen-256color"
#set -g default-terminal "xterm-kitty"
# set-option -ga terminal-overrides ",xterm-256color:Tc"
# set-option -sa terminal-overrides ",xterm-kitty:RGB"

# # KiTTY always appends to clipboard; must clear it first
# # https://sw.kovidgoyal.net/kitty/protocol-extensions.html#pasting-to-clipboard
set-option -ag terminal-overrides ",xterm-kitty:Ms=\\E]52;c;%p2%s\\7"
set-option -ag terminal-overrides ",xterm-256color:Ms=\\E]52;c;%p1%s%p2%s\\7"
set-option -ag terminal-overrides ",screen-256color:Ms=\\E]52;c;%p1%s%p2%s\\7"

# Kitty extended keys 
set -g extended-keys on 
set -as terminal-features 'screen*:extkeys' # for kitty with tmux
# set -as terminal-features 'xterm*:extkeys' # for kitty with tmux
set -ga terminal-overrides ",xterm-kitty:Tc"
set -ga terminal-overrides ",screen-256color:Tc" # Add support for screen-256color terminal

## Sesh integration
bind "t" run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 80%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -I -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
    --preview-window 'right:55%' \
    --preview 'sesh preview {}'
)\""

# recommendation
# bind x kill-pane # skip "kill-pane 1? (y/n)" prompt
set -g detach-on-destroy off  # don't exit from tmux when closing a session
bind -N "last-session (via sesh) " u run-shell "sesh last"
## Sesh end

