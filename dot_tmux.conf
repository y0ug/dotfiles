## Bell Notifications
set -g bell-action any
set -g visual-bell off

# Tell tmux to mark windows when a bell happens
set -g monitor-bell on

set-hook -g alert-bell 'run-shell "notify-send \"🔔 Tmux Bell\" \"Session: #{session_name}\nWindow: #{window_index}:#{window_name}\nPane: #{pane_index}\" --urgency=normal"'


## Custom Keybindings
bind Tab last-window
bind r source-file ~/.tmux.conf
bind s run-shell "tmux-switch-pane"
bind A next-window -a

bind J "join-pane -s !" # Extract pan use is prefix !
bind v copy-mode
bind G neww -n "git" -S lazygit
bind e neww -n "nvim" -S nvim 

bind-key -T copy-mode-vi v send-keys -X begin-selection

bind -r '(' switch-client -p\; refresh-client -S
bind -r ')' switch-client -n\; refresh-client -S

# Copy-mode OSC 133 shell integration
# C-z scrolls back to last old prompt
# C-x scrolls forward to later prompt
#bind-key -T copy-mode  /  \; send-keys -X previous-prompt \; send-keys -X previous-prompt \; send-key /
bind-key -T copy-mode    C-z send-keys -X previous-prompt
bind-key -T copy-mode-vi C-z send-keys -X previous-prompt
bind-key -T copy-mode    C-x send-keys -X next-prompt
bind-key -T copy-mode-vi C-x send-keys -X next-prompt

## Pain Control
# pane_navigation_bindings
bind-key h   select-pane -L
bind-key C-h select-pane -L
bind-key j   select-pane -D
bind-key C-j select-pane -D
bind-key k   select-pane -U
bind-key C-k select-pane -U
bind-key l   select-pane -R
bind-key C-l select-pane -R

# window_move_bindings() {
bind-key -r "<" swap-window -d -t -1
bind-key -r ">" swap-window -d -t +1

# pane_resizing_bindings() 
pane_resize=5
bind-key -r H resize-pane -L "$pane_resize"
bind-key -r J resize-pane -D "$pane_resize"
bind-key -r K resize-pane -U "$pane_resize"
bind-key -r L resize-pane -R "$pane_resize"

# pane_split_bindings() {
bind-key "|" split-window -h -c "#{pane_current_path}"
bind-key "\\" split-window -fh -c "#{pane_current_path}"
bind-key "-" split-window -v -c "#{pane_current_path}"
bind-key "_" split-window -fv -c "#{pane_current_path}"
bind-key "%" split-window -h -c "#{pane_current_path}"
bind-key '"' split-window -v -c "#{pane_current_path}"

# improve_new_window_binding() {
bind-key "c" new-window -c "#{pane_current_path}"

