## Status bar
set -g status on
set -g status-interval 2
set -g status-position top
set -g status-justify absolute-centre

set -g status-bg $base01
set -g status-fg $subtext
set -g status-style "bg=$base00,fg=$subtext"

set -g status-left-length 40
set -g status-left '#[bold,fg='$teal']#S#[default]'

set -g window-status-bell-style "bold,fg=$red"
set -g window-status-activity-style "bold,fg=$red"
